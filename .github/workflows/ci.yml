# Continuous integration for StockFlow Backend Lab.
# Builds and verifies each application independently, per ROADMAP section 7:
# Java 21, Maven Wrapper, ./mvnw --batch-mode clean verify, fail on test
# failure. JDK 21 runs pinned here per ADR 0004; local evidence was recorded
# separately in docs/STATUS.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - discovery-server
          - api-gateway
          - catalog-service
          - warehouse-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Temurin JDK 21 (ADR 0004)
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify ${{ matrix.app }}
        working-directory: apps/${{ matrix.app }}
        run: ./mvnw --batch-mode clean verify
