# Opt-in lab override: a second catalog instance for the load balancing lab (unit 5.5).
# Use together with the core file:
#   docker compose -f compose.yaml -f compose.labs.yaml up --build -d
# It also exposes the metrics endpoint on both catalog instances (internal network only,
# no host port) so the per-instance request count can be read. It also turns on request-level DEBUG logs
# on the gateway and catalog so the trace id (unit 5.8) is visible in their log lines.
services:
  catalog:
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      # stampede lab (unit 6.3): LAB_SINGLE_FLIGHT=false switches the protection off
      STOCKFLOW_CACHE_SINGLE_FLIGHT: ${LAB_SINGLE_FLIGHT:-true}
      # request lines at DEBUG, so the trace id shows up in the log (tracing lab, unit 5.8); env var names are lowercased, so use a package, not a class
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_SERVLET: DEBUG

  gateway:
    environment:
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY_HANDLER: DEBUG

  # race condition lab (unit 7.1): switches on the deliberately broken withdraw endpoint, never in the core file
  warehouse:
    environment:
      STOCKFLOW_LAB_UNSAFE_STOCK: "true"

  catalog-2:
    build: ./apps/catalog-service
    image: stockflow/catalog-service:0.0.1-SNAPSHOT
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalogdb
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}
      STOCKFLOW_SECURITY_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://localhost:8081/actuator/health/readiness -O /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks:
      - stockflow
    stop_grace_period: 30s
    restart: unless-stopped

  # Eviction lab (unit 6.2): a separate, memory-capped Redis, so the experiment cannot evict the gateway's
  # rate-limit keys or the product cache. Not started by default; run labs/caching/eviction-lab.sh, or:
  #   LAB_REDIS_POLICY=allkeys-lru docker compose -f compose.yaml -f compose.labs.yaml --profile eviction up -d redis-lab
  redis-lab:
    image: redis:7.4.12-alpine
    container_name: stockflow-redis-lab
    profiles: ["eviction"]
    command:
      - redis-server
      - --maxmemory
      - ${LAB_REDIS_MAXMEMORY:-8mb}
      - --maxmemory-policy
      - ${LAB_REDIS_POLICY:-allkeys-lru}
      - --maxmemory-samples
      - "10"
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - stockflow

  # Replica lab (unit 7.10): a PostgreSQL primary and a streaming-replication standby of it, separate from the core
  # `postgres` so the experiments cannot touch the service databases. No host ports; reach them with `docker compose
  # exec`. Not started by default: docker compose -f compose.yaml -f compose.labs.yaml --profile replica up -d
  # The lab roles reuse POSTGRES_SUPER_PASSWORD (throwaway data, internal network only).
  pg-primary:
    image: postgres:16.15-alpine
    profiles: ["replica"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?set POSTGRES_SUPER_PASSWORD in .env}
    volumes:
      - ./labs/database/replica/01-replication.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - stockflow

  pg-replica:
    image: postgres:16.15-alpine
    profiles: ["replica"]
    entrypoint: ["sh", "/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: pg-primary
      REPLICATION_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?set POSTGRES_SUPER_PASSWORD in .env}
    volumes:
      - ./labs/database/replica/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    networks:
      - stockflow

  # Messaging lab (Phase 9): RabbitMQ broker with the management HTTP API on the internal network only (no host ports).
  # Not started by default: docker compose -f compose.yaml -f compose.labs.yaml --profile messaging up -d rabbitmq
  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: stockflow-rabbitmq
    profiles: ["messaging"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - stockflow
