server:
  port: 8082

spring:
  application:
    name: warehouse-service
  datasource:
    # Pooled HikariCP DataSource (spring-boot-starter-jdbc). The first run
    # without a real DataSource bean showed that Boot silently skips
    # FlywayAutoConfiguration when no DataSource exists - hence
    # starter-jdbc instead of the flyway-owns-its-connection attempt
    # (evidence in docs/STATUS.md). JPA arrives in Phase 3 on this
    # same DataSource. POSTGRES_PORT defaults to 15432 because a native
    # PostgreSQL 18 service holds 5432 on this machine (see compose.yaml).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/warehousedb
    username: warehouse_app
    # No default: startup fails fast when the password env is missing.
    password: ${WAREHOUSE_DB_PASSWORD}
  flyway:
    # Migrates the primary DataSource above on every startup.
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
