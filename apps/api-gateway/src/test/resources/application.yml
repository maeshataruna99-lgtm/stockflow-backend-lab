spring:
  config:
    import: "optional:classpath:application.yml"
  cloud:
    discovery:
      client:
        simple:
          instances:
            CATALOG-SERVICE:
              - uri: http://localhost:${wiremock.server.port:8089}
            WAREHOUSE-SERVICE:
              - uri: http://localhost:${wiremock.server.port:8089}

eureka:
  client:
    enabled: false

management:
  health:
    redis:
      enabled: false


stockflow:
  security:
    jwt:
      secret: test-only-signing-key-not-a-real-secret-0123456789

# test fixtures for DemoAuthController, which has no defaults
ROOT_PASSWORD: root_demo_password_123
DEMO_USER_PASSWORD: user_demo_password_123

# Liveness says the process is alive and not wedged; readiness says traffic may be sent here (guidebook 26).
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.liveness.include: livenessState
management.endpoint.health.group.readiness.include: readinessState
