server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalog-products-route
          uri: lb://CATALOG-SERVICE
          predicates:
            - Path=/api/v1/products, /api/v1/products/**
        - id: catalog-categories-route
          uri: lb://CATALOG-SERVICE
          predicates:
            - Path=/api/v1/categories, /api/v1/categories/**
        - id: warehouse-route
          uri: lb://WAREHOUSE-SERVICE
          predicates:
            - Path=/api/v1/warehouses, /api/v1/warehouses/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
