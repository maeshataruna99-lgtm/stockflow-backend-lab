server:
  port: 8080

spring:
  application:
    name: api-gateway

# routes live only in GatewayRoutesConfig: a copy here would be a second route without the rate limiter and breaker

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

# every outbound call has a connect and a response timeout; the circuit breaker timeout must stay above
# retries x response-timeout (see stockflow.gateway.circuit-breaker.timeout)
spring.cloud.gateway.server.webflux.httpclient:
  connect-timeout: 2000
  response-timeout: 1s

# lab setting: sample every request so each one can be followed in the logs
management.tracing.sampling.probability: 1.0

# puts the trace id into reactive log lines (MDC) on the gateway
spring.reactor.context-propagation: auto

# The rate limiter talks to Redis on every request. Without a timeout Lettuce waits 60 s per command, so a Redis
# outage froze every request for a minute. With these, the limiter gives up fast and lets the request through
# (RedisRateLimiter fails open): an outage costs the rate limit, not availability.
spring.data.redis.timeout: 300ms
spring.data.redis.connect-timeout: 300ms

# Liveness says the process is alive and not wedged; readiness says traffic may be sent here (guidebook 26).
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.liveness.include: livenessState
management.endpoint.health.group.readiness.include: readinessState

# Graceful shutdown: on SIGTERM stop taking new connections, let requests in flight finish for up to 20 s (guidebook 27).
# The container stop_grace_period in compose.yaml is longer than this.
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
