# Test profile: no eureka; the database comes from a real Testcontainers
# PostgreSQL (postgres:16.15-alpine, wired via @ServiceConnection) so the
# Flyway migrations and the JPA mappings run against the actual engine.
eureka:
  client:
    enabled: false

stockflow:
  security:
    jwt:
      secret: test-only-signing-key-not-a-real-secret-0123456789
  cache:
    # off for the whole suite so no test depends on a Redis at localhost; the cache tests switch it on
    enabled: false

# mirrors application.yml (this file shadows it in tests): the optional cache must not decide health
management:
  health:
    redis:
      enabled: false

# Liveness says the process is alive and not wedged, so it must not depend on the database; readiness says traffic
# may be sent here, so it does (guidebook 26). The two answers are different on purpose.
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.liveness.include: livenessState
management.endpoint.health.group.readiness.include: readinessState,db
