# PostgreSQL (postgres:16.15-alpine, wired via @ServiceConnection) so the
# Flyway migrations and the JPA mappings run against the actual engine.
eureka:
  client:
    enabled: false

stockflow:
  security:
    jwt:
      secret: test-only-signing-key-not-a-real-secret-0123456789
