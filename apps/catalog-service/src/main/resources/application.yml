server:
  port: 8081

spring:
  application:
    name: catalog-service
  datasource:
    # Pooled HikariCP DataSource (spring-boot-starter-jdbc). The first run
    # without a real DataSource bean showed that Boot silently skips
    # FlywayAutoConfiguration when no DataSource exists - hence
    # starter-jdbc instead of the flyway-owns-its-connection attempt
    # (evidence in docs/STATUS.md). JPA arrives in Phase 3 on this
    # same DataSource. POSTGRES_PORT defaults to 15432 because a native
    # PostgreSQL 18 service holds 5432 on this machine (see compose.yaml).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/catalogdb
    username: catalog_app
    # No default: startup fails fast when the password env is missing.
    password: ${CATALOG_DB_PASSWORD}
  flyway:
    # Migrates the primary DataSource above on every startup.
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Migrations own the schema; Hibernate only proves the mappings
      # match it. Any entity drift from the Flyway schema fails startup.
      ddl-auto: validate
    # Entities are never serialized (API contract uses DTOs), so the
    # lazy-loading-in-view antipattern has no reason to exist.
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

# lab setting: sample every request so each one can be followed in the logs
management.tracing.sampling.probability: 1.0

# Phase 6 product cache (cache-aside on GET /api/v1/products/{id}). Redis is an optimisation, the database is the
# source of truth: a Redis outage must not make the service unhealthy, so its health check is off, and every Redis
# call has a short timeout so an outage costs at most that much per request.
spring.data.redis.timeout: 300ms
spring.data.redis.connect-timeout: 300ms
management.health.redis.enabled: false
stockflow.cache.enabled: true
stockflow.cache.product-ttl: 60s

# Liveness says the process is alive and not wedged, so it must not depend on the database; readiness says traffic
# may be sent here, so it does (guidebook 26). The two answers are different on purpose.
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.liveness.include: livenessState
management.endpoint.health.group.readiness.include: readinessState,db

# Graceful shutdown: on SIGTERM stop taking new connections, let requests in flight finish for up to 20 s (guidebook 27).
# The container stop_grace_period in compose.yaml is longer than this.
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
