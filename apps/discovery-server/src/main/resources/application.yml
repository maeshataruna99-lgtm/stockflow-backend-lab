server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Liveness says the process is alive and not wedged; readiness says traffic may be sent here (guidebook 26).
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.liveness.include: livenessState
management.endpoint.health.group.readiness.include: readinessState

# Graceful shutdown: on SIGTERM stop taking new connections, let requests in flight finish for up to 20 s (guidebook 27).
# The container stop_grace_period in compose.yaml is longer than this.
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
